<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Theme color (#5B4FD4 = --color-accent) -->
    <meta name="theme-color" content="#5B4FD4" />
    <meta name="description" content="LiveTranslate — real-time tarjimon: ustoz gapiradi, talabalar o'z tilida o'qiydi." />

    <!-- PWA manifest -->
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- iOS / Safari PWA -->
    <meta name="apple-mobile-web-app-capable"          content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title"            content="LiveTranslate" />
    <link rel="apple-touch-icon"                       href="/icon-192.svg" />
    <link rel="apple-touch-icon" sizes="512x512"       href="/icon-512.svg" />

    <!-- Android Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <!-- Google Fonts — preconnect first, then the stylesheet.
         The @import in index.css also works; these preconnects
         just let the browser open the connection earlier. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet"
          href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" />

    <title>LiveTranslate</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
