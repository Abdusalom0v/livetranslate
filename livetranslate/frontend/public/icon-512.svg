<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F77DD"/>
      <stop offset="1" stop-color="#4A3FC0"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="0" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Background rounded square (maskable safe zone: inner 80%) -->
  <rect width="512" height="512" rx="100" fill="url(#bg)"/>
  <rect width="512" height="512" rx="100" fill="url(#shine)"/>

  <!-- Microphone body -->
  <rect x="200" y="72" width="112" height="200" rx="56"
        fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Mic arc -->
  <path d="M136 248 C136 344 376 344 376 248"
        fill="none" stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Stand line + base -->
  <line x1="256" y1="344" x2="256" y2="408"
        stroke="white" stroke-width="20" stroke-linecap="round"/>
  <line x1="192" y1="408" x2="320" y2="408"
        stroke="white" stroke-width="20" stroke-linecap="round"/>

  <!-- Translation spark dots -->
  <circle cx="378" cy="152" r="14" fill="white" opacity="0.9"/>
  <circle cx="420" cy="112" r="10" fill="white" opacity="0.65"/>
  <circle cx="400" cy="80"  r="7"  fill="white" opacity="0.4"/>
</svg>
