<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7F77DD"/>
      <stop offset="1" stop-color="#4A3FC0"/>
    </linearGradient>
  </defs>

  <!-- Full bleed background (no rounding — maskable icons fill whole square) -->
  <rect width="512" height="512" fill="url(#bg)"/>

  <!-- Content in safe zone (inner 80% = 51px padding each side) -->
  <!-- Mic body — scaled to fit safe zone -->
  <rect x="210" y="96" width="92" height="168" rx="46"
        fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>

  <path d="M152 256 C152 340 360 340 360 256"
        fill="none" stroke="white" stroke-width="18" stroke-linecap="round"/>

  <line x1="256" y1="340" x2="256" y2="390"
        stroke="white" stroke-width="18" stroke-linecap="round"/>
  <line x1="200" y1="390" x2="312" y2="390"
        stroke="white" stroke-width="18" stroke-linecap="round"/>

  <circle cx="365" cy="156" r="12" fill="white" opacity="0.9"/>
  <circle cx="400" cy="120" r="9"  fill="white" opacity="0.65"/>
  <circle cx="383" cy="92"  r="6"  fill="white" opacity="0.4"/>
</svg>
